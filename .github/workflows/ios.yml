# The iPhone app, built on GitHub's Macs (no Mac of your own needed). See NATIVE.md.
#
# - Every change to the app: builds it for the iPhone simulator, opens it on a simulated iPhone, and keeps pictures of
#   the screen (Actions, this run, Artifacts). Nothing is signed or sent anywhere.
# - "Run workflow" (Actions, iPhone app): the same, then signs it with your Apple account and sends it to TestFlight,
#   where your iPhone gets it. That part needs the four secrets in NATIVE.md.
name: iPhone app

on:
  push:
    branches: [main, native-ios]
    paths:
      - index.html
      - reminder.wav
      - icons/**
      - ios/**
      - package.json
      - package-lock.json
      - capacitor.config.json
      - tools/build-www.cjs
      - .github/workflows/ios.yml
  workflow_dispatch:
    inputs:
      testflight:
        description: Send this build to TestFlight
        type: boolean
        default: true

concurrency:
  group: iphone-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  BUNDLE_ID: com.jreynoso867.todo

jobs:
  simulator:
    name: Build, then open on a simulated iPhone
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Get Capacitor and its plugins
        run: npm ci

      - name: Copy the app into the iPhone project
        run: npm run sync

      - name: Check every plugin made it in
        run: |
          for p in AppPlugin FilesystemPlugin HapticsPlugin LocalNotificationsPlugin SharePlugin; do
            grep -q "\"$p\"" ios/App/App/capacitor.config.json || { echo "::error::$p is missing from the app"; exit 1; }
          done

      - name: Use the newest Xcode 26
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$XC" ] || { echo "::error::No Xcode 26 on this machine"; ls /Applications; exit 1; }
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - uses: actions/cache@v4
        with:
          path: build/SourcePackages
          key: spm-${{ hashFiles('package-lock.json') }}

      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build -clonedSourcePackagesDirPath build/SourcePackages \
            CODE_SIGNING_ALLOWED=NO build | tail -n 40

      - name: Open it on a simulated iPhone and take pictures
        run: |
          set -euo pipefail
          APP=build/Build/Products/Debug-iphonesimulator/App.app
          test -d "$APP"
          # The newest iOS on this machine, and an iPhone that runs it
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys, re
          d = json.load(sys.stdin)["devices"]
          ios = sorted((k for k in d if "SimRuntime.iOS" in k), key=lambda k: [int(x) for x in re.findall(r"\d+", k.split("iOS")[-1])])
          for rt in reversed(ios):
              phones = [x for x in d[rt] if x["name"].startswith("iPhone") and x.get("isAvailable")]
              if phones:
                  print(phones[-1]["udid"]); break
          ')
          [ -n "$UDID" ] || { echo "::error::No iPhone simulator found"; xcrun simctl list devices; exit 1; }
          xcrun simctl list devices | grep "$UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          mkdir -p shots
          xcrun simctl ui "$UDID" appearance light
          xcrun simctl launch "$UDID" "$BUNDLE_ID"
          sleep 15
          xcrun simctl io "$UDID" screenshot shots/1-first-open-light.png
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true
          xcrun simctl ui "$UDID" appearance dark
          xcrun simctl launch "$UDID" "$BUNDLE_ID"
          sleep 10
          xcrun simctl io "$UDID" screenshot shots/2-first-open-dark.png
          # What the page said while it ran (Capacitor passes the page's messages on to the system log)
          xcrun simctl spawn "$UDID" log show --last 2m --style compact --predicate 'process == "App"' > shots/app-log.txt 2>&1 || true
          grep -iE "error|exception|refused" shots/app-log.txt | head -40 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iphone-simulator
          path: shots/
          if-no-files-found: warn

  testflight:
    name: Sign and send to TestFlight
    needs: simulator
    if: github.event_name == 'workflow_dispatch' && inputs.testflight
    runs-on: macos-26
    timeout-minutes: 60
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
    steps:
      - name: Check the four secrets are there (NATIVE.md, step 5)
        env:
          KEY_P8: ${{ secrets.APPSTORE_KEY_P8 }}
        run: |
          missing=""
          [ -n "$TEAM_ID" ] || missing="$missing APPLE_TEAM_ID"
          [ -n "$KEY_ID" ] || missing="$missing APPSTORE_KEY_ID"
          [ -n "$ISSUER_ID" ] || missing="$missing APPSTORE_ISSUER_ID"
          [ -n "$KEY_P8" ] || missing="$missing APPSTORE_KEY_P8"
          [ -z "$missing" ] || { echo "::error::Missing secrets:$missing. See NATIVE.md, step 5."; exit 1; }

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run sync

      - name: Use the newest Xcode 26
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Put the App Store Connect key where Xcode looks
        env:
          KEY_P8: ${{ secrets.APPSTORE_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8"
          chmod 600 "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8"
          grep -q "BEGIN PRIVATE KEY" "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8" || { echo "::error::APPSTORE_KEY_P8 should be the whole .p8 file, BEGIN and END lines included"; exit 1; }

      - name: Build and sign (Apple makes the certificate and profile)
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -o pipefail
          # A new build number every run: TestFlight takes each number once.
          BUILD=$(( 100 + RUN_NUMBER ))
          echo "Build number $BUILD"
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" CURRENT_PROJECT_VERSION="$BUILD" \
            archive | tail -n 60

      - name: Send to App Store Connect (TestFlight)
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID" | tail -n 60
          echo "Sent. App Store Connect takes a few minutes to process it; then it shows in TestFlight on your iPhone."

      - name: Remove the key from this machine
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
