# The iPhone app, built on GitHub's Macs (no Mac of your own needed). See NATIVE.md.
#
# - Every change to the app: builds it for the iPhone simulator, opens it on a simulated iPhone, and keeps pictures of
#   the screen (Actions, this run, Artifacts). Nothing is signed or sent anywhere.
# - "Run workflow" (Actions, iPhone app): the same, then signs it with your Apple account and sends it to TestFlight,
#   where your iPhone gets it. That part needs the four secrets in NATIVE.md.
name: iPhone app

on:
  push:
    branches: [main, native-ios]
    paths:
      - index.html
      - sw.js
      - manifest.webmanifest
      - archivo.woff2
      - reminder.wav
      - icons/**
      - ios/**
      - package.json
      - package-lock.json
      - capacitor.config.json
      - tools/build-www.cjs
      - tools/screen-text.swift
      - .github/workflows/ios.yml
  workflow_dispatch:
    inputs:
      testflight:
        description: Send this build to TestFlight
        type: boolean
        default: true

# Checks of pushes queue among themselves; a TestFlight run has its own queue, so a push never cancels it.
concurrency:
  group: iphone-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  BUNDLE_ID: com.jreynoso867.todo

jobs:
  simulator:
    name: Build, then open on a simulated iPhone
    # On every change. "Run workflow" goes straight to TestFlight, unless "Send this build to TestFlight" is unticked.
    if: github.event_name == 'push' || !inputs.testflight
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Get Capacitor and its plugins
        run: npm ci

      - name: Copy the app into the iPhone project (marked for the check below; TestFlight builds never are)
        run: |
          node -e "const fs=require('fs'),f='capacitor.config.json',c=JSON.parse(fs.readFileSync(f,'utf8'));c.ios.appendUserAgent='TodoCIProof';fs.writeFileSync(f,JSON.stringify(c,null,2))"
          npm run sync
          grep -q TodoCIProof ios/App/App/capacitor.config.json

      - name: Check every plugin made it in
        run: |
          for p in AppPlugin FilesystemPlugin HapticsPlugin LocalNotificationsPlugin SharePlugin; do
            grep -q "\"$p\"" ios/App/App/capacitor.config.json || { echo "::error::$p is missing from the app"; exit 1; }
          done

      - name: Use Xcode 26 (Apple takes uploads from Xcode 26 on; never a beta)
        run: |
          MAJOR=$(xcodebuild -version | awk 'NR==1 { split($2, v, "."); print v[1] }')
          if [ "${MAJOR:-0}" -lt 26 ]; then
            XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -vi beta | sort -V | tail -1)
            [ -n "$XC" ] || { echo "::error::No Xcode 26 on this machine"; ls /Applications; exit 1; }
            sudo xcode-select -s "$XC"
          fi
          xcodebuild -version

      - uses: actions/cache@v5
        with:
          path: build/SourcePackages
          key: spm-${{ hashFiles('package-lock.json') }}

      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build -clonedSourcePackagesDirPath build/SourcePackages \
            CODE_SIGNING_ALLOWED=NO build | tail -n 40

      - name: Check what's inside the app (Apple refuses uploads without these)
        run: |
          APP=build/Build/Products/Debug-iphonesimulator/App.app
          test -f "$APP/PrivacyInfo.xcprivacy" || { echo "::error::PrivacyInfo.xcprivacy isn't in the app"; exit 1; }
          sips -g hasAlpha ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png | grep -q "hasAlpha: no" || { echo "::error::The app icon has transparency; App Store Connect refuses that"; exit 1; }
          test -f "$APP/public/reminder.wav" || { echo "::error::The reminder sound isn't in the app"; exit 1; }
          test -f "$APP/public/index.html"
          echo "::notice title=Inside the app::$(du -sh "$APP" | cut -f1) in all; the privacy file, an icon with no transparency, the page and the reminder sound are there"

      - name: A tool to allow notifications on the simulated iPhone without tapping (unofficial; optional)
        continue-on-error: true
        run: |
          brew tap wix/brew
          brew trust wix/brew || brew trust --formula wix/brew/applesimutils || true
          brew install wix/brew/applesimutils
          applesimutils --version || true

      - name: Open it on a simulated iPhone, close it, and wait for the reminder
        run: |
          set -euo pipefail
          APP=build/Build/Products/Debug-iphonesimulator/App.app
          test -d "$APP"
          swiftc -O tools/screen-text.swift -o "$RUNNER_TEMP/screen-text"
          # The newest iOS on this machine, and an iPhone that runs it
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys, re
          d = json.load(sys.stdin)["devices"]
          ios = sorted((k for k in d if "SimRuntime.iOS" in k), key=lambda k: [int(x) for x in re.findall(r"\d+", k.split("iOS")[-1])])
          for rt in reversed(ios):
              phones = [x for x in d[rt] if x["name"].startswith("iPhone") and x.get("isAvailable")]
              if phones:
                  print(phones[-1]["udid"]); break
          ')
          [ -n "$UDID" ] || { echo "::error::No iPhone simulator found"; xcrun simctl list devices; exit 1; }
          echo "::notice title=Simulated iPhone::$(xcrun simctl list devices | grep "$UDID" | xargs)"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          ALLOWED=""
          if command -v applesimutils > /dev/null && applesimutils --byId "$UDID" --bundle "$BUNDLE_ID" --setPermissions notifications=YES; then
            ALLOWED=1
            echo "::notice title=Notifications::allowed ahead of time on the simulated iPhone"
          else
            echo "::warning title=Notifications::couldn't allow them ahead of time; the app will ask, and nobody taps Allow here"
          fi
          mkdir -p shots
          # 1. First start, light: the welcome (the app's own output, with the page's console, goes to a file)
          xcrun simctl ui "$UDID" appearance light
          # (with a terminal attached the app writes each line at once; to a plain file it would keep them until it quits)
          xcrun simctl launch --console-pty --terminate-running-process "$UDID" "$BUNDLE_ID" > shots/app-1.txt 2>&1 &
          sleep 15
          xcrun simctl io "$UDID" screenshot shots/1-light.png
          # 2. Second start, dark: the check's one task, due in a minute or two
          xcrun simctl ui "$UDID" appearance dark
          xcrun simctl launch --console-pty --terminate-running-process "$UDID" "$BUNDLE_ID" > shots/app-2.txt 2>&1 &
          sleep 15
          xcrun simctl io "$UDID" screenshot shots/2-dark.png
          # 3. Close the app for good, then watch the home screen until a little after the task is due
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true
          DUE=$(grep -ho "proof task due at [0-9T:.Z-]*" shots/app-2.txt | head -1 | awk '{print $NF}' || true)
          echo "Task due at: ${DUE:-unknown}"
          LEFT=$(python3 -c "import datetime,sys; d='$DUE'; print(int((datetime.datetime.fromisoformat(d.replace('Z','+00:00'))-datetime.datetime.now(datetime.timezone.utc)).total_seconds()) if d else 150)")
          echo "Seconds until due: $LEFT"
          SEEN=""
          END=$(( $(date +%s) + LEFT + 180 ))
          while [ "$(date +%s)" -lt "$END" ]; do
            xcrun simctl io "$UDID" screenshot shots/frame.png > /dev/null 2>&1 || true
            TEXT=$("$RUNNER_TEMP/screen-text" shots/frame.png fast || true)
            if echo "$TEXT" | grep -qi "plumber"; then
              SEEN="$TEXT"; cp shots/frame.png shots/3-reminder.png
              python3 -c "import datetime; d='$DUE'; print('Seen', int((datetime.datetime.now(datetime.timezone.utc)-datetime.datetime.fromisoformat(d.replace('Z','+00:00'))).total_seconds()) if d else '?', 'seconds after it was due')" | tee shots/seen.txt
              break
            fi
            sleep 1
          done
          if [ -n "$SEEN" ]; then
            echo "::notice title=Reminder with the app closed::$(cat shots/seen.txt) | ${SEEN:0:1500}"
          else
            xcrun simctl io "$UDID" screenshot shots/3-reminder.png || true
            if [ -n "$ALLOWED" ]; then
              echo "::error title=Reminder with the app closed::notifications were allowed, but no reminder showed within 3 minutes of the due time"
              exit 1
            fi
            echo "::warning title=Reminder with the app closed::not seen (notifications couldn't be allowed ahead of time here)"
          fi

      - name: Report what the app showed and said
        run: |
          for f in shots/1-light.png shots/2-dark.png shots/3-reminder.png; do
            [ -f "$f" ] && echo "::notice title=On screen ($(basename "$f" .png))::$("$RUNNER_TEMP/screen-text" "$f" | cut -c1-3000)"
          done
          grep -h "\[To-Do\]" shots/app-*.txt | sort -u | head -5 | while IFS= read -r line; do echo "::notice title=App said::${line:0:1000}"; done || true
          grep -hiE "\[error\]|exception|refused|failed" shots/app-*.txt | sort -u | head -5 | while IFS= read -r line; do echo "::warning title=App error::${line:0:1000}"; done || true

      - name: A small copy of picture 1
        run: |
          sips -Z 420 -s format jpeg -s formatOptions 45 shots/1-light.png --out shots/1-small.jpg > /dev/null
          B=$(base64 -i shots/1-small.jpg | tr -d '\n'); N=$(( (${#B} + 3999) / 4000 )); i=0
          while [ -n "$B" ] && [ $i -lt 9 ]; do i=$((i+1)); echo "::notice title=shot1 $i/$N::${B:0:4000}"; B=${B:4000}; done

      - name: A small copy of picture 2
        run: |
          sips -Z 420 -s format jpeg -s formatOptions 45 shots/2-dark.png --out shots/2-small.jpg > /dev/null
          B=$(base64 -i shots/2-small.jpg | tr -d '\n'); N=$(( (${#B} + 3999) / 4000 )); i=0
          while [ -n "$B" ] && [ $i -lt 9 ]; do i=$((i+1)); echo "::notice title=shot2 $i/$N::${B:0:4000}"; B=${B:4000}; done

      - name: A small copy of picture 3
        if: always()
        run: |
          [ -f shots/3-reminder.png ] || exit 0
          sips -Z 420 -s format jpeg -s formatOptions 45 shots/3-reminder.png --out shots/3-small.jpg > /dev/null
          B=$(base64 -i shots/3-small.jpg | tr -d '\n'); N=$(( (${#B} + 3999) / 4000 )); i=0
          while [ -n "$B" ] && [ $i -lt 9 ]; do i=$((i+1)); echo "::notice title=shot3 $i/$N::${B:0:4000}"; B=${B:4000}; done

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: iphone-simulator
          path: shots/
          if-no-files-found: warn

  testflight:
    name: Sign and send to TestFlight
    if: github.event_name == 'workflow_dispatch' && inputs.testflight
    runs-on: macos-26
    timeout-minutes: 60
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
    steps:
      - name: Check the four secrets are there (NATIVE.md, step 5)
        env:
          KEY_P8: ${{ secrets.APPSTORE_KEY_P8 }}
        run: |
          missing=""
          [ -n "$TEAM_ID" ] || missing="$missing APPLE_TEAM_ID"
          [ -n "$KEY_ID" ] || missing="$missing APPSTORE_KEY_ID"
          [ -n "$ISSUER_ID" ] || missing="$missing APPSTORE_ISSUER_ID"
          [ -n "$KEY_P8" ] || missing="$missing APPSTORE_KEY_P8"
          [ -z "$missing" ] || { echo "::error::Missing secrets:$missing. See NATIVE.md, step 5."; exit 1; }

      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run sync

      - name: Use Xcode 26 (Apple takes uploads from Xcode 26 on; never a beta)
        run: |
          MAJOR=$(xcodebuild -version | awk 'NR==1 { split($2, v, "."); print v[1] }')
          if [ "${MAJOR:-0}" -lt 26 ]; then
            XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -vi beta | sort -V | tail -1)
            [ -n "$XC" ] || { echo "::error::No Xcode 26 on this machine"; ls /Applications; exit 1; }
            sudo xcode-select -s "$XC"
          fi
          xcodebuild -version

      - name: Put the App Store Connect key where Xcode looks
        env:
          KEY_P8: ${{ secrets.APPSTORE_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8"
          chmod 600 "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8"
          grep -q "BEGIN PRIVATE KEY" "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8" || { echo "::error::APPSTORE_KEY_P8 should be the whole .p8 file, BEGIN and END lines included"; exit 1; }

      - name: Build (unsigned for now; Apple signs it on the way up, so no certificate is needed here)
        env:
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -o pipefail
          # A new build number every run (and every retry): TestFlight takes each number once.
          BUILD="$(( 100 + RUN_NUMBER )).$RUN_ATTEMPT"
          echo "::notice title=Build number::$BUILD"
          xcodebuild archive -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGN_STYLE=Automatic CODE_SIGN_IDENTITY=- AD_HOC_CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="$TEAM_ID" PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" CURRENT_PROJECT_VERSION="$BUILD" \
            2>&1 | tee "$RUNNER_TEMP/archive.log" | tail -n 60

      - name: Sign with Apple's cloud certificate and send to App Store Connect (TestFlight)
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          plutil -lint "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID" 2>&1 | tee "$RUNNER_TEMP/export.log" | tail -n 60
          echo "::notice title=Sent::Apple processes it next (usually minutes; you get an email). Then it's in TestFlight."

      - name: What went wrong, if something did
        if: failure()
        run: |
          # At most 9 notes (GitHub keeps 10 errors a step): the build's errors, then the upload's, then Apple's own log.
          {
            grep -hE "error:|\*\* ARCHIVE FAILED" "$RUNNER_TEMP/archive.log" 2>/dev/null | sort -u | head -3
            grep -hiE "error|failed|denied|permission|not found|invalid" "$RUNNER_TEMP/export.log" 2>/dev/null | sort -u | head -3
            LOGS=$(find "${TMPDIR:-/tmp}" -maxdepth 3 -name "*.xcdistributionlogs" 2>/dev/null | head -1)
            [ -n "$LOGS" ] && grep -rhiE "error|failed" "$LOGS" 2>/dev/null | sort -u | head -3
          } | head -9 | while IFS= read -r line; do echo "::error title=What went wrong::${line:0:900}"; done || true

      - name: Remove the key from this machine
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
